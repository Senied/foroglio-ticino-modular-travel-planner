name: Review two Fuori Porta photos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pillow requests
      - name: Download room and outdoor candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          import requests,io,json
          items={
          'B01-room':'https://q-xx.bstatic.com/xdata/images/hotel/max1000/111051850.jpg?a=8128712&k=60f667cc715bfb903fd41909174ce8f3e7ae7a248a8922bae9bf139728f7cd86&o=',
          'B06-outdoor':'https://q-xx.bstatic.com/xdata/images/hotel/max1000/47680510.jpg?a=8128712&k=42c94b8d7cfa20d450a06963a7e5f91462e1329e0054b5ccfdbf2f0f032331b1&o='
          }
          out=Path('fuori-porta-two-photo-review');out.mkdir()
          s=requests.Session();s.headers['User-Agent']='TravelGuideEditorialReview/1.0';meta=[]
          for name,url in items.items():
              r=s.get(url,timeout=60);r.raise_for_status();im=Image.open(io.BytesIO(r.content)).convert('RGB');im.save(out/f'{name}.jpg',quality=95,optimize=True);meta.append({'name':name,'url':url,'width':im.width,'height':im.height})
          (out/'metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          sheet=Image.new('RGB',(1400,600),(245,245,243));draw=ImageDraw.Draw(sheet)
          for i,item in enumerate(meta):
              im=Image.open(out/f"{item['name']}.jpg").convert('RGB');fit=ImageOps.fit(im,(660,500),Image.Resampling.LANCZOS);x=i*700+20;sheet.paste(fit,(x,20));draw.text((x,530),f"{item['name']} · {item['width']}×{item['height']}",fill=(15,40,32))
          sheet.save(out/'contact-sheet.jpg',quality=93)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: Fuori-Porta-two-photo-review, path: fuori-porta-two-photo-review/, retention-days: 3}
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fuori-porta-two-photo-review.yml
          git commit -m "Remove temporary hotel-photo review workflow"
          git push
